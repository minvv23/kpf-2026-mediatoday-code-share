<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 뉴스 브리핑 뷰어</title>
<style>
  body { margin: 0 auto; max-width: 1200px; padding: 20px; font-family: sans-serif; }
  header { text-align: center; padding: 16px; background: #333; color: #fff; }
  nav button { margin: 0 12px; }
  #cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
  .card { border: 1px solid #ddd; padding: 16px; white-space: pre-wrap; }
  footer { margin-top: 32px; font-size: 12px; color: #777; }
</style>
</head>
<body>
<header>
  <h1>AI 뉴스 브리핑</h1>
  <nav><button id="prev">&lt;</button><span id="date"></span><button id="next">&gt;</button></nav>
</header>
<main id="cards"></main>
<footer>본 시스템(서비스)은 한국언론진흥재단의 지원을 받아 개발되었습니다.</footer>

<script>
  // 결과 조회 API 주소는 각사 환경에 맞게 지정한다 (docs/data_format.md 참고).
  const API = "";
  let day = new Date();

  function ymd(d) {
    return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
  }

  async function load() {
    document.getElementById("date").textContent = ymd(day);
    const box = document.getElementById("cards");
    if (!API) { box.textContent = "API 주소가 설정되지 않았습니다."; return; }
    const data = await fetch(`${API}?date=${ymd(day)}`).then(r => r.json());
    box.innerHTML = (data.items || [])
      .map(it => `<div class="card"><h3>${it.title}</h3>${it.body}</div>`).join("");
  }

  document.getElementById("prev").onclick = () => { day.setDate(day.getDate() - 1); load(); };
  document.getElementById("next").onclick = () => { day.setDate(day.getDate() + 1); load(); };
  load();
</script>
</body>
</html>
