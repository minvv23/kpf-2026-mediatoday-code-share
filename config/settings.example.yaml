# config/settings.yaml 로 복사해 사용. 환경변수가 있으면 환경변수가 우선한다.
input_path: ./sample/articles.csv
output_dir: ./output
log_level: INFO

editorial_keyword: 사설
min_body_chars: 200
window_hours: 24

k_min: 2
k_max: 10
random_state: 0

min_shared_words: 1
divergence_min: 0.5
min_local_per_issue: 1
max_reports: 1
